[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "mosaicopdf"
version = "2.0.0"
description = "Herramienta libre y vectorial para dividir y escalar documentos PDF en mosaicos imprimibles."
readme = "README.md"
requires-python = ">=3.10"

dependencies = ["PyMuPDF>=1.24"]

authors = [{ name = "Fabián España" }]

license = { text = "MIT" }


[project.scripts]
mosaicopdf = "mosaicopdf.__main__:main"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
mosaicopdf = [
    "integrations/inkscape/*",
    "integrations/linux/*",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
